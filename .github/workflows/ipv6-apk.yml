name: IPv6 HTTPS APK

on:
  push:
    branches: ['codex/ipv6-direct-https']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Test and build IPv6 Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v6
      - name: Android tests, lint and APK
        working-directory: apps/mobile/android
        run: bash ./gradlew --no-daemon :app:lintDebug :app:testDebugUnitTest :app:testIconUi :app:assembleDebug -x :app:lintAnalyzeDebugUnitTest -x :app:lintAnalyzeDebugAndroidTest
      - name: Prepare downloadable APK
        run: |
          mkdir -p apk
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk apk/dsh-mobile-ipv6-debug.apk
          sha256sum apk/dsh-mobile-ipv6-debug.apk > apk/dsh-mobile-ipv6-debug.apk.sha256
          printf 'IPv6 HTTPS and icon customization fork test build. Debug signed; cannot replace an App signed with another key.\nCommit: %s\n' "$GITHUB_SHA" > apk/BUILD.txt
      - name: Build parallel icon test APK
        working-directory: apps/mobile/android
        run: bash ./gradlew --no-daemon :app:assembleIconTest
      - name: Prepare parallel APK
        run: |
          cp apps/mobile/android/app/build/outputs/apk/iconTest/*.apk apk/dsh-mobile-icons-parallel-debug.apk
          sha256sum apk/dsh-mobile-icons-parallel-debug.apk > apk/dsh-mobile-icons-parallel-debug.apk.sha256
          printf '\nParallel build: io.github.sayach.dshmobile.icontest, display name DSH Mobile. Installs alongside the old App; pair computers again in this separate App.\n' >> apk/BUILD.txt
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$aapt" dump badging apk/dsh-mobile-icons-parallel-debug.apk > apk/PARALLEL.txt
          grep -F "package: name='io.github.sayach.dshmobile.icontest'" apk/PARALLEL.txt
          grep -F "application-label:'DSH Mobile'" apk/PARALLEL.txt
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$apksigner" verify --verbose --print-certs apk/dsh-mobile-icons-parallel-debug.apk >> apk/PARALLEL.txt
      - uses: actions/upload-artifact@v7
        with:
          name: dsh-mobile-ipv6-apk
          path: apk/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-test-reports
          path: |
            apps/mobile/android/app/build/reports/
            apps/mobile/android/app/build/test-results/
            apps/mobile/android/app/build/icon-ui-evidence/
          if-no-files-found: ignore

  plugin:
    name: Test and package IPv6 desktop plugin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run smoke:control-state
      - name: Package plugin
        run: |
          mkdir -p package
          npm pack --pack-destination package
      - uses: actions/upload-artifact@v7
        with:
          name: dsh-mobile-ipv6-plugin
          path: package/*.tgz
          if-no-files-found: error
